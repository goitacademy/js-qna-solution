<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q&A: події, делегування та бібліотеки</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 48px 24px;
        color: #172033;
        background: #f4f7fb;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
      }

      button {
        padding: 10px 16px;
        color: #fff;
        background: #4f46e5;
        border: 0;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        transition:
          background-color 150ms ease,
          transform 150ms ease;
      }

      button:hover {
        background: #4338ca;
        transform: translateY(-1px);
      }

      .js-actions,
      .js-menu,
      .periods {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 16px;
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 6%);
      }

      [data-action='delete'] {
        background: #dc2626;
      }

      [data-action='delete']:hover {
        background: #b91c1c;
      }

      .is-active {
        color: #1e1b4b;
        background: #facc15;
      }

      .is-active:hover {
        background: #eab308;
      }

      .card {
        max-width: 320px;
        padding: 24px;
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 6%);
      }

      .card h2 {
        margin: 0 0 16px;
      }

      .chart-wrapper {
        max-width: 760px;
        padding: 24px;
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(15 23 42 / 6%);
      }

      .periods {
        margin-bottom: 16px;
        padding: 0;
        border: 0;
        box-shadow: none;
      }

      .js-chart-summary {
        min-height: 24px;
        margin: 0 0 16px;
        color: #475569;
        font-weight: 600;
      }

      #sales-chart {
        width: 100%;
      }
    </style>
  </head>
